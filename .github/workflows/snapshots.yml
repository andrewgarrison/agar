# Regenerates the Linux visual baselines and commits them to the branch.
# Run it from the Actions tab on a PR branch after an intended visual change.
name: Update visual snapshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build && pnpm docs:build
      - run: pnpm e2e --project=chromium --grep @visual --update-snapshots
        env:
          CI: "true"
      - name: Commit baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/__snapshots__
          git diff --cached --quiet || git commit -m "test: update visual snapshots"
          git push

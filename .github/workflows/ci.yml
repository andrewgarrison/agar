name: CI

# Every PR runs the full suite: there's no merge queue, so this is the check
# that guards main. Budgets (scripts/ci/budget.sh, scripts/ci/checks.ts) fail a
# job that gets slow; find the cause instead of raising them.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # A new commit on a PR cancels that PR's run in progress. Runs on main are
  # never cancelled: they seed the caches PRs restore.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read # scripts/ci/budget.sh reads the job's start time

jobs:
  checks:
    name: Checks (format, lint, types, unit, build, size, package)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record job start
        run: echo "CI_JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          filter: blob:none
      - uses: ./.github/actions/setup
      - name: 'Budget: setup'
        run: scripts/ci/budget.sh setup 15 --defer
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Checks
        run: bun scripts/ci/checks.ts
      - name: 'Budget: job'
        if: always()
        run: scripts/ci/budget.sh job 35
        env:
          GH_TOKEN: ${{ github.token }}

  e2e:
    name: E2E + axe (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Browsers are restored from cache. Playwright's image (browsers and OS
    # libraries baked in) was measured too: pulling it takes ~21 s on hosted
    # runners, more than the whole setup budget.
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Record job start
        run: echo "CI_JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          filter: blob:none
      - uses: ./.github/actions/setup
      - name: Read the Playwright version
        id: pw
        run: |
          echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Restore ${{ matrix.browser }}
        id: browser-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.browser }}
      - name: Install browsers
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: bunx playwright install ${{ matrix.browser }}
      - name: Save ${{ matrix.browser }}
        if: steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}
      # The hosted image already has Chromium's and Firefox's OS libraries.
      # WebKit's (GStreamer and friends) are unpacked once and cached, instead
      # of apt-installed every run (19-37 s). See scripts/ci/webkit-libs.sh.
      - name: Restore WebKit's OS libraries
        id: webkit-libs
        if: matrix.browser == 'webkit'
        uses: actions/cache/restore@v4
        with:
          path: ~/webkit-libs
          key: webkit-libs-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.image }}-${{ steps.pw.outputs.version }}
      - name: Unpack WebKit's OS libraries
        if: matrix.browser == 'webkit' && steps.webkit-libs.outputs.cache-hit != 'true'
        run: scripts/ci/webkit-libs.sh unpack ~/webkit-libs
      - name: Save WebKit's OS libraries
        if: matrix.browser == 'webkit' && steps.webkit-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/webkit-libs
          key: ${{ steps.webkit-libs.outputs.cache-primary-key }}
      - name: Use WebKit's OS libraries
        if: matrix.browser == 'webkit'
        run: scripts/ci/webkit-libs.sh env ~/webkit-libs
      - name: Restore Next.js build cache
        id: next-cache
        uses: actions/cache/restore@v4
        with:
          path: apps/docs/.next/cache
          key: next-${{ hashFiles('bun.lock') }}-${{ hashFiles('apps/docs/**', 'packages/*/src/**') }}
          restore-keys: next-${{ hashFiles('bun.lock') }}-
      - name: 'Budget: setup'
        run: scripts/ci/budget.sh setup 15 --defer
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build
        run: bun run build && bun run docs:build
      - name: Save Next.js build cache
        if: steps.next-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: apps/docs/.next/cache
          key: ${{ steps.next-cache.outputs.cache-primary-key }}
      - name: Playwright
        run: bun run e2e --project=${{ matrix.browser }}
      - name: 'Budget: job'
        if: always()
        run: scripts/ci/budget.sh job 35
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report
          retention-days: 7

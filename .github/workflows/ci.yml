name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, build, test, size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run build
      - run: bun check
      - run: bun run test
      - run: bun run size
      - run: bun run check:pkg

  e2e:
    name: E2E, axe, visual (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: bunx playwright install --with-deps ${{ matrix.browser }}
      - run: bun run build && bun run docs:build
      - run: bun run e2e --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report
          retention-days: 7
